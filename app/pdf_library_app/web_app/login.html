<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="bookverse-api-url" content="" />
  <title>BookVerse — Connexion</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo">📖</div>
      <h1 id="form-title">Bienvenue</h1>

      <form id="auth-form" novalidate>
        <div class="field" id="name-field" hidden>
          <label for="name">Nom (optionnel)</label>
          <input type="text" id="name" autocomplete="name" />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" autocomplete="current-password" required minlength="8" />
        </div>

        <div class="field" id="confirm-field" hidden>
          <label for="confirm-password">Confirmer le mot de passe</label>
          <input type="password" id="confirm-password" autocomplete="new-password" minlength="8" />
        </div>

        <div class="form-error" id="form-error" hidden role="alert"></div>

        <button type="submit" class="btn btn-primary" id="submit-btn" style="width: 100%;">
          Connexion
        </button>
      </form>

      <div class="auth-switch">
        <span id="switch-text">Pas encore de compte ?</span>
        <button type="button" id="switch-btn">En créer un</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
